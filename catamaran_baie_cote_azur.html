<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Catamaran Côte d’Azur</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--sea:#24d4ca;--ink:#edf7f8;--panel:rgba(4,25,35,.78);--edge:rgba(166,230,238,.22);--gold:#e6bd69}*
{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#061f2a;color:var(--ink);font:500 15px system-ui,sans-serif;touch-action:none;user-select:none}#gl{position:fixed;inset:0;width:100%;height:100%}#menu{position:fixed;inset:0;z-index:20;overflow:auto;background:linear-gradient(180deg,rgba(4,22,32,.48),rgba(4,22,32,.94));padding:max(24px,env(safe-area-inset-top)) 18px 30px}.wrap{max-width:860px;margin:auto}.title{font-size:clamp(42px,8vw,74px);line-height:.9;text-transform:uppercase;margin:8px 0 14px}.title em{color:var(--sea);font-style:normal}.lead{max-width:650px;color:#abc1c9}.card{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.card button{padding:16px;text-align:left;color:var(--ink);border:1px solid var(--edge);border-radius:8px;background:rgba(10,45,57,.72)}.card button.on{border-color:var(--sea);background:rgba(36,212,202,.16)}.card b{display:block;font-size:22px}.row{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}.ctl{min-width:220px;flex:1}.ctl label{display:flex;justify-content:space-between;color:#bfd1d6}.seg{display:flex}.seg button{flex:1;padding:11px;border:1px solid var(--edge);border-right:0;background:rgba(10,45,57,.72);color:var(--ink)}.seg button:last-child{border-right:1px solid var(--edge)}.seg button.on{background:var(--sea);color:#06212a;font-weight:800}input[type=range]{width:100%;accent-color:var(--sea)}#go{padding:15px 38px;border:0;border-radius:8px;background:var(--sea);color:#05212a;font-size:24px;font-weight:900;text-transform:uppercase;margin-top:8px}#hud{position:fixed;inset:0;z-index:10;pointer-events:none}.pill{position:absolute;background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:9px 12px}.top{left:12px;right:12px;top:10px;display:flex;justify-content:space-between}.top .pill{position:static}.bottom{left:12px;right:12px;bottom:12px;display:flex;justify-content:center}.speed{position:static;text-align:center}.speed b{display:block;font-size:64px;line-height:.85}.speed span{font-size:12px;letter-spacing:.2em}.stats{display:flex}.stats div{min-width:70px;text-align:center;border-right:1px solid var(--edge)}.stats div:last-child{border:0}.stats b{display:block;font-size:23px}.stats span{font-size:10px;color:#a7bac1}#toast{position:absolute;left:50%;top:25%;transform:translate(-50%,20px);opacity:0;transition:.25s;background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:12px 18px}#toast.show{opacity:1;transform:translate(-50%,0)}#touch{position:fixed;inset:0;z-index:12;pointer-events:none}.pad{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));display:grid;gap:7px}.pad.l{left:12px;grid-template-columns:repeat(2,72px)}.pad.r{right:12px;grid-template-columns:repeat(3,68px)}#touch button{height:58px;border:1px solid var(--edge);border-radius:9px;background:rgba(4,25,35,.7);color:var(--ink);pointer-events:auto;font-weight:800}#touch button.down{background:var(--sea);color:#05212a}#paused{position:fixed;inset:0;z-index:15;display:grid;place-items:center;background:rgba(3,16,24,.55);font-size:48px;font-weight:900;letter-spacing:.15em}[hidden]{display:none!important}@media(max-width:700px){.bottom{top:70px;bottom:auto}.stats{display:none}.speed b{font-size:44px}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<section id="menu">
  <div class="wrap">
    <h1 class="title">Catamaran <em>Azur</em></h1>
    <p class="lead">Simulation navigateur avec baies turquoise, ville méditerranéenne, fausses ruelles pavées, façades ocre, volets bleus et vert olive.</p>
    <div class="card" id="spots">
      <button class="on" data-spot="azur"><b>Côte d’Azur</b><span>Ruelles, plage, port et falaises</span></button>
      <button data-spot="moorea"><b>Moorea</b><span>Lagon tropical et montagnes</span></button>
      <button data-spot="dolphins"><b>Baie des dauphins</b><span>Îles pastel et lagon clair</span></button>
    </div>
    <div class="row">
      <div class="ctl"><label>Vent <output id="windV">14 kn</output></label><input id="wind" type="range" min="4" max="30" value="14"></div>
      <div class="ctl"><label>Provenance <output id="dirV">0°</output></label><input id="dir" type="range" min="0" max="350" step="10" value="0"></div>
      <div class="ctl"><label>Vagues <output id="waveV">0,8 m</output></label><input id="wave" type="range" min="1" max="25" value="8"></div>
    </div>
    <div class="row">
      <div class="ctl"><label>Mode</label><div class="seg"><button class="on" data-mode="free">Navigation libre</button><button data-mode="course">Course aux bouées</button></div></div>
      <div class="ctl"><label>Départ</label><div class="seg"><button class="on" data-start="beach">Plage</button><button data-start="port">Port</button></div></div>
    </div>
    <button id="go">Démarrer</button>
  </div>
</section>
<section id="hud" hidden>
  <div class="top"><div class="pill" id="state">Navigation</div><div class="pill" id="sail">Voile réglée</div></div>
  <div id="toast"></div>
  <div class="bottom"><div class="pill speed"><b id="spd">0,0</b><span>NŒUDS</span></div><div class="pill stats"><div><b id="hdg">090</b><span>CAP</span></div><div><b id="tws">14</b><span>VENT</span></div><div><b id="aws">0</b><span>APPARENT</span></div></div></div>
</section>
<div id="touch" hidden><div class="pad l"><button data-k="left">◀ Bâbord</button><button data-k="right">Tribord ▶</button></div><div class="pad r"><button data-k="in">Border</button><button data-k="up">Accélérer</button><button data-k="out">Choquer</button></div></div>
<div id="paused" hidden>PAUSE</div>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const canvas=$('#gl'), renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,6000);
scene.add(new THREE.HemisphereLight(0xbfdcff,0x183545,1.35));const sun=new THREE.DirectionalLight(0xffe6b0,1.65);sun.position.set(-280,420,-180);sun.castShadow=true;scene.add(sun);
let cfg={spot:'azur',mode:'free',start:'beach',wind:14,dir:0,wave:.8},running=false,paused=false,last=performance.now(),keys={},touchKeys={},boat=null,sea=null,buoys=[],town=null;
const hue={azur:{sea:[.08,.38,.48],shallow:[.14,.72,.74],wall:['#f1d99d','#eab17a','#f2c48f','#f0dfbf','#dfaa58','#d8b99a'],shut:['#315f83','#557d55','#315d73','#6a4433','#b04e36','#f1eee2'],roof:['#a64f2f','#b96034','#8f3d27','#cc753b']},moorea:{sea:[.03,.25,.38],shallow:[.05,.65,.55],wall:['#f6f0e2','#7fd0c8','#f2a38a','#f5d680'],shut:['#2f8f83','#d9594a','#386c9a','#6a4a2e'],roof:['#9d6634','#bd7a43','#744b2e','#d19a52']},dolphins:{sea:[.05,.30,.42],shallow:[.12,.68,.70],wall:['#f4c9c1','#bfe0e8','#f7e6a8','#d4e6b8','#f3e9dc'],shut:['#2f6f9a','#e0655a','#3b8f6a','#e8a33a'],roof:['#477083','#cc783e','#84484a','#4d7771']}};
function hex(h){const n=parseInt(h.slice(1),16);return new THREE.Color(((n>>16)&255)/255,((n>>8)&255)/255,(n&255)/255)}
function makesea(){const pal=hue[cfg.spot];if(sea){scene.remove(sea);sea.geometry.dispose();sea.material.dispose()}const geo=new THREE.PlaneGeometry(4000,4000,180,180);const mat=new THREE.ShaderMaterial({uniforms:{uTime:{value:0},uDeep:{value:new THREE.Color(...pal.sea)},uShallow:{value:new THREE.Color(...pal.shallow)}},vertexShader:'uniform float uTime; varying float vH; void main(){vec3 p=position;p.z+=sin(p.x*.025+uTime)*.32+cos(p.y*.032-uTime*.8)*.22;p.z+=sin((p.x+p.y)*.07+uTime*1.3)*.10;vH=p.z;gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);}',fragmentShader:'uniform vec3 uDeep,uShallow;varying float vH;void main(){float x=smoothstep(-.5,.5,vH);vec3 c=mix(uDeep,uShallow,.45+x*.25);gl_FragColor=vec4(c,1.0);}',transparent:false});sea=new THREE.Mesh(geo,mat);sea.rotation.x=-Math.PI/2;scene.add(sea)}
function makeTown(){if(town){scene.remove(town);town.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose()})}town=new THREE.Group();const pal=hue[cfg.spot];const sand=new THREE.MeshStandardMaterial({color:cfg.spot==='azur'?0xd8be83:0xe8dcaf,roughness:.9});for(let i=-900;i<900;i+=15){const coastY=-i*.025+150*Math.sin(i*.004)+20*Math.sin(i*.019);const sandStrip=new THREE.Mesh(new THREE.BoxGeometry(14,.3,70),sand);sandStrip.position.set(i,.2,coastY+35);town.add(sandStrip)}for(let z=-650;z<-80;z+=70){const road=new THREE.Mesh(new THREE.BoxGeometry(900,.08,12),new THREE.MeshStandardMaterial({color:0xd9b982,roughness:.95}));road.position.set(-35,.1,z);town.add(road)}for(let i=0;i<90;i++){const u=-760+i*17,z=-180-rnd(i*2)*105,x=u+Math.sin(i)*8;const floors=3+(i%3),w=13+(i%4)*2,d=11+(i%3)*2,h=3.2+floors*3.1;const wall=hex(pal.wall[i%pal.wall.length]),shut=hex(pal.shut[i%pal.shut.length]),roof=hex(pal.roof[i%pal.roof.length]);const g=new THREE.Group();for(let f=0;f<floors;f++){const body=new THREE.Mesh(new THREE.BoxGeometry(w,3,d),new THREE.MeshStandardMaterial({color:wall,roughness:.9}));body.position.y=1.5+f*3.1;g.add(body);for(let k=-1;k<=1;k++){const win=new THREE.Mesh(new THREE.BoxGeometry(1.5,1.8,.08),new THREE.MeshStandardMaterial({color:0x58788e,roughness:.3}));win.position.set(k*w*.25,1.7+f*3.1,d/2+.06);g.add(win);if(k!==0&&f>0){const v=new THREE.Mesh(new THREE.BoxGeometry(.38,1.9,.08),new THREE.MeshStandardMaterial({color:shut}));v.position.set(k*w*.25,1.7+f*3.1,d/2+.16);g.add(v)}}}const top=new THREE.Mesh(new THREE.ConeGeometry(Math.max(w,d)*.72,1.7,4),new THREE.MeshStandardMaterial({color:roof,roughness:.85}));top.rotation.y=Math.PI/4;top.position.y=h;top.scale.z=.72;g.add(top);g.position.set(x,.1,z);g.rotation.y=-.02*Math.sin(i);town.add(g)}scene.add(town)}
function rnd(n){let x=Math.sin(n*91.7)*43758.5453;return x-Math.floor(x)}
makesea();makeTown();
const state={x:0,z:110,psi:0,u:0,v:0,heel:0};
function resetBoat(){state.x=cfg.start==='port'?-420:0;state.z=cfg.start==='port'?40:145;state.psi=cfg.dir*Math.PI/180+Math.PI;state.u=cfg.start==='port'?1.8:2.2;state.v=0;state.heel=0}
function makeBoat(){if(boat){scene.remove(boat)}boat=new THREE.Group();const hullMat=new THREE.MeshStandardMaterial({color:0xf2f5ef,roughness:.35});const deckMat=new THREE.MeshStandardMaterial({color:0x172a35,roughness:.55});for(const x of [-1.05,1.05]){const hull=new THREE.Mesh(new THREE.BoxGeometry(.48,.38,4.8),hullMat);hull.position.set(x,.45,0);hull.castShadow=true;boat.add(hull)}const deck=new THREE.Mesh(new THREE.BoxGeometry(2.2,.10,3.2),deckMat);deck.position.y=.65;boat.add(deck);const mast=new THREE.Mesh(new THREE.CylinderGeometry(.035,.055,5.2,10),new THREE.MeshStandardMaterial({color:0x15181a,roughness:.45}));mast.position.set(0,3.0,.35);boat.add(mast);const sail=new THREE.Mesh(new THREE.PlaneGeometry(2.8,4.2),new THREE.MeshStandardMaterial({color:0xf5f1df,side:THREE.DoubleSide,roughness:.6}));sail.position.set(.75,2.9,.45);sail.rotation.z=-.18;boat.add(sail);boat.userData.sail=sail;scene.add(boat)}
function makeBuoys(){buoys.forEach(b=>scene.remove(b));buoys=[];for(let i=0;i<7;i++){const a=i/7*Math.PI*2+.4,r=280;const g=new THREE.Group();const float=new THREE.Mesh(new THREE.CylinderGeometry(.35,.55,.9,12),new THREE.MeshStandardMaterial({color:i%2?0xff7a00:0xffd400,roughness:.5}));float.position.y=.45;const pole=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,2.4,8),new THREE.MeshStandardMaterial({color:0xffffff}));pole.position.y=1.7;g.add(float,pole);g.position.set(Math.cos(a)*r,0,Math.sin(a)*r-180);scene.add(g);buoys.push(g)}}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}
$$('.card').forEach(b=>b.onclick=()=>{$$('.card').forEach(x=>x.classList.remove('on'));b.classList.add('on');cfg.spot=b.dataset.spot;makesea();makeTown();envSpot()});
$$('[data-mode]').forEach(b=>b.onclick=()=>{$$('[data-mode]').forEach(x=>x.classList.remove('on'));b.classList.add('on');cfg.mode=b.dataset.mode});$$('[data-start]').forEach(b=>b.onclick=()=>{$$('[data-start]').forEach(x=>x.classList.remove('on'));b.classList.add('on');cfg.start=b.dataset.start});
$('#wind').oninput=e=>{cfg.wind=+e.target.value;$('#windV').textContent=cfg.wind+' kn'};$('#dir').oninput=e=>{cfg.dir=+e.target.value;$('#dirV').textContent=cfg.dir+'°'};$('#wave').oninput=e=>{cfg.wave=+e.target.value/10;$('#waveV').textContent=cfg.wave.toFixed(1).replace('.',',')+' m'};
function envSpot(){scene.fog=new THREE.Fog(hue[cfg.spot].sea[0]?hex(cfg.spot==='azur'?'#93d6d8':cfg.spot==='moorea'?'#79c8c5':'#a7d9d5'):0x93d6d8,250,1900)}
$('#go').onclick=()=>{resetBoat();makeBoat();makeBuoys();running=true;$('#menu').hidden=true;$('#hud').hidden=false;$('#touch').hidden=false;toast(cfg.spot==='azur'?'Bienvenue sur la Côte d’Azur':'Bienvenue dans votre baie');};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '){keys[' ']=true}if(e.key.toLower==='p')togglePause()});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;keys[' ']=false});$$('[data-k]').forEach(b=>{b.onpointerdown=e=>{e.preventTarget&&e.preventDefault();touchKeys[b.dataset.k]=true;b.classList.add('down')};b.onpointerup=b.onpointercancel=()=>{touchKeys[b.dataset.k]=false;b.classList.remove('down')}});
function togglePause(){paused=!paused;$('#paused').hidden=!paused}
function physics(dt){if(!running||paused)return;const left=keys.arrowleft||keys.a||touchKeys.left,right=keys.arrowright||keys.d||touchKeys.right;const steer=(left?-1:0)+(right?1:0);state.psi+=steer*dt*(.65+state.u*.025);let power=(keys.arrowup||keys.w||touchKeys.up)?1:(keys.arrowdown||keys.s||touchKeys.down)?-.35:.65;if(keys.q||touchKeys.in)power+=.25;if(keys.e||touchKeys.out||keys[' ']||touchKeys.out)power-=.65;state.u+=power*dt*1.15;state.u*=1-dt*.025;state.u=clamp(state.u,0,11);const heel=clamp((cfg.wind/20)*(state.u/5)-.12,-.7,.9);state.heel+=(heel-state.heel)*dt*1.4;state.x+=Math.sin(state.psi)*state.u*dt;state.z-=Math.cos(state.psi)*state.u*dt;const dist=Math.hypot(state.x,state.z);if(dist>1450){state.u*=.96}}const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function updateHUD(){if(!running||!boat)return;$('#spd').textContent=(state.u*1.94384).toFixed(1).replace('.',',');$('#hdg').textCode=String(Math.round(state.psi/D2R+360)%360).padStart(3,'0');$('#hdg').textContent=$('#hdg').textCode;$('#tws').textContent=cfg.wind;$('#aws').textContent=Math.round(cfg.wind+state.u*.5)}
function animate(now){requestAnimationFrame(animate);const dt=Math.min(.05,(now-last)/1000||.0167);last=now;if(sea)sea.material.uniforms.uTime.value=now*.001;physics(dt);if(running&&boat){boat.position.set(state.x,sea?0.22:0,state.z);boat.rotation.y=-state.psi;boat.rotation.z=-state.heel;boat.userData.sail.rotation.z=-.16-state.heel*.18;const camDir=new THREE.Vector3(Math.sin(state.psi),0,-Math.cos(state.psi));camera.position.copy(boat.position).addScaledVector(camDir,-11).add(new THREE.Vector3(0,5.5,0));camera.lookAt(boat.position.clone().add(new THREE.Vector3(0,1.4,0)));buoys.forEach((b,i)=>b.position.y=.35+Math.sin(now*.002+i)*.18);updateHUD()}renderer.render(scene,camera)}
makesea();makeTown();resetBoat();makeBoat();camera.position.set(0,7,18);camera.lookAt(0,0,0);requestAnimationFrame(animate);
})();
</script>
</body>
</html>
